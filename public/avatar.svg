<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glasses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="120" cy="120" r="115" fill="url(#bg-grad)" />
  <circle cx="120" cy="120" r="105" fill="#0f172a" opacity="0.85" />

  <!-- Developer Silhouette / Illustration -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Torso / Hoodie -->
    <path d="M50 215 C55 170 85 160 120 160 C155 160 185 170 190 215 Z" fill="url(#shirt)" />
    <!-- Collar / Inner Shirt -->
    <path d="M102 160 L120 185 L138 160 Z" fill="#e2e8f0" />
    
    <!-- Neck -->
    <rect x="106" y="132" width="28" height="30" rx="6" fill="url(#skin)" />
    
    <!-- Head / Face -->
    <ellipse cx="120" cy="115" rx="36" ry="42" fill="url(#skin)" />
    
    <!-- Hair -->
    <path d="M84 105 C84 75 100 68 120 68 C145 68 156 78 156 102 C156 107 154 112 150 115 C146 95 138 82 120 82 C102 82 92 94 88 112 C85 110 84 108 84 105 Z" fill="url(#hair)" />
    <path d="M82 108 C80 90 92 70 120 70 C148 70 158 88 158 106 C150 94 135 88 120 88 C105 88 92 94 82 108 Z" fill="url(#hair)" />

    <!-- Glasses Frame -->
    <rect x="94" y="104" width="22" height="18" rx="4" fill="none" stroke="url(#glasses)" stroke-width="3.5" />
    <rect x="124" y="104" width="22" height="18" rx="4" fill="none" stroke="url(#glasses)" stroke-width="3.5" />
    <path d="M116 112 L124 112" stroke="url(#glasses)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M88 110 L94 110" stroke="url(#glasses)" stroke-width="3" stroke-linecap="round" />
    <path d="M146 110 L152 110" stroke="url(#glasses)" stroke-width="3" stroke-linecap="round" />
    <!-- Eyes behind glasses -->
    <circle cx="105" cy="113" r="3" fill="#1e293b" />
    <circle cx="135" cy="113" r="3" fill="#1e293b" />
    <circle cx="106.5" cy="111.5" r="1" fill="#ffffff" />
    <circle cx="136.5" cy="111.5" r="1" fill="#ffffff" />

    <!-- Friendly Smile -->
    <path d="M110 135 Q120 144 130 135" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Tech Badges / Code Accent -->
  <g transform="translate(160, 45)">
    <circle cx="18" cy="18" r="20" fill="#0ea5e9" opacity="0.9" filter="url(#shadow)" />
    <text x="18" y="24" font-size="16" font-family="monospace" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g transform="translate(25, 60)">
    <circle cx="16" cy="16" r="18" fill="#10b981" opacity="0.9" filter="url(#shadow)" />
    <text x="16" y="22" font-size="15" font-family="monospace" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡</text>
  </g>
</svg>
